<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

    <img src="/static/images/logo.png" class="logo">

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <p id="message"></p>

    <p>

        Don't have an account?

        <a href="/signup-page">
            Signup
        </a>

    </p>

</div>

<script src="/static/js/login.js"></script>

</body>

</html>
